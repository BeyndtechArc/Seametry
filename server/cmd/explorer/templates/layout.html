{{define "head"}}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.Title}} · Seametry</title>
<link rel="icon" href="{{.MarkAsset}}" type="image/svg+xml">
<script src="theme.js"></script>
<link rel="preload" href="fonts/Switzer-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="explorer.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="word" href="index.html" aria-label="Seametry Explorer">
      <img class="house-mark" src="{{.MarkAsset}}" alt="">
      <span class="word-lockup"><strong>Seametry</strong><small>Explorer</small></span>
    </a>
    <nav aria-label="Explorer">
      <a href="index.html"{{if eq .Nav "verify"}} aria-current="page"{{end}}>Verify</a>
      <a href="catalogue.html"{{if eq .Nav "catalogue"}} aria-current="page"{{end}}>Catalogue</a>
      <a href="evidence.html"{{if eq .Nav "evidence"}} aria-current="page"{{end}}>Evidence</a>
      <a href="hall.html"{{if eq .Nav "hall"}} aria-current="page"{{end}}>The Hall</a>
      <span class="devnet">Devnet</span>
    </nav>
    <button class="mode" id="theme-control" type="button" aria-label="Use dark mode">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"></path></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8 8 0 0 1 8.8 4a8.2 8.2 0 1 0 11.2 11.2Z"></path></svg>
    </button>
  </header>
{{end}}

{{define "foot"}}
  <footer>
    <p>Generated {{.Generated}} from repository evidence. Verification runs in your browser. The Hall runs on devnet and has not been audited.</p>
</footer>
</div>
</body>
</html>
{{end}}
