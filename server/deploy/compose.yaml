# The Go core, account authority and PostgreSQL stay on Docker's private
# network. Caddy is the only public edge and obtains TLS for
# SEAMETRY_API_ORIGIN.

name: seametry

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SEAMETRY_POSTGRES_PASSWORD:?set SEAMETRY_POSTGRES_PASSWORD in server/deploy/.env}
      POSTGRES_DB: seametry
    volumes:
      # PostgreSQL 18 stores clusters below a versioned directory so major
      # upgrades can use pg_upgrade without crossing a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seametry"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-database:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: ${SEAMETRY_POSTGRES_PASSWORD:?set SEAMETRY_POSTGRES_PASSWORD in server/deploy/.env}
      SEAMETRY_AUTH_POSTGRES_PASSWORD: ${SEAMETRY_AUTH_POSTGRES_PASSWORD:?set SEAMETRY_AUTH_POSTGRES_PASSWORD in server/deploy/.env}
    volumes:
      - ./init-auth-db.sh:/usr/local/bin/init-auth-db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-auth-db.sh"]

  auth-migrate:
    build:
      context: ../..
      dockerfile: server/deploy/Auth.Dockerfile
    depends_on:
      auth-database:
        condition: service_completed_successfully
    environment: &auth-environment
      AUTH_DATABASE_URL: postgres://seametry_auth:${SEAMETRY_AUTH_POSTGRES_PASSWORD}@postgres:5432/seametry_auth?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in server/deploy/.env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://seametry.xyz}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY:?set BETTER_AUTH_API_KEY in server/deploy/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in server/deploy/.env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in server/deploy/.env}
      SEAMETRY_APP_ORIGINS: ${SEAMETRY_APP_ORIGINS:-https://seametry.xyz,http://localhost:3000}
    command: ["node", "src/migrate.mjs"]

  auth:
    build:
      context: ../..
      dockerfile: server/deploy/Auth.Dockerfile
    restart: unless-stopped
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    environment:
      <<: *auth-environment
      PORT: "3005"
    expose:
      - "3005"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SEAMETRY_DATABASE_URL: postgres://postgres:${SEAMETRY_POSTGRES_PASSWORD}@postgres:5432/seametry?sslmode=disable
    command: ["migrate"]

  replay:
    profiles: [demo]
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SEAMETRY_DATABASE_URL: postgres://postgres:${SEAMETRY_POSTGRES_PASSWORD}@postgres:5432/seametry?sslmode=disable
      SEAMETRY_OBJECT_STORE_DIR: /var/lib/seametry/objects
    command: ["replay"]
    volumes:
      - object-data:/var/lib/seametry/objects

  record-demo-batch:
    profiles: [demo]
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    depends_on:
      replay:
        condition: service_completed_successfully
    environment:
      SEAMETRY_DATABASE_URL: postgres://postgres:${SEAMETRY_POSTGRES_PASSWORD}@postgres:5432/seametry?sslmode=disable
    command: ["record-demo-batch"]

  seametry:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      SEAMETRY_DATABASE_URL: postgres://postgres:${SEAMETRY_POSTGRES_PASSWORD}@postgres:5432/seametry?sslmode=disable
      SEAMETRY_OBJECT_STORE_DIR: /var/lib/seametry/objects
      SEAMETRY_HALL_DEVNET_RPC_URL: ${SEAMETRY_HALL_DEVNET_RPC_URL:-https://api.devnet.solana.com}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-}
      JUP_KEY: ${JUP_KEY:-}
    expose:
      - "8080"
    volumes:
      - object-data:/var/lib/seametry/objects

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - seametry
      - auth
    environment:
      SEAMETRY_API_ORIGIN: ${SEAMETRY_API_ORIGIN:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  object-data:
  caddy-data:
  caddy-config:
