# Local development, and the shape Fly and later Oracle run
# (docs/prd/API.md section 11). SEAMETRY_DATABASE_URL is the admin
# connection `seametry migrate` needs; it is never committed with a real
# password, only this local, throwaway one.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seametry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SEAMETRY_DATABASE_URL: postgres://postgres:postgres@postgres:5432/seametry?sslmode=disable
    command: ["migrate"]

  seametry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
