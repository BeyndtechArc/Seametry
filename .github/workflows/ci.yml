name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"

jobs:
  spec:
    name: Conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Regenerates the vectors and fails if the result differs from what is
      # committed. This is what stops anyone editing a vector by hand to make
      # an implementation pass. It also reruns every generator self-check,
      # including the CVE-2012-2459 non-collision.
      - name: Vectors match their generator
        run: node shared/tools/spec/generate.mjs --check

      # The anchor vector's worth is that @solana/web3.js, not our code, built
      # it, so its generator imports the library and needs an install that
      # generate.mjs deliberately does not.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: The anchor transaction matches @solana/web3.js
        run: node shared/tools/spec/anchor-vector.mjs --check

  cross-implementation:
    name: Go seals, JavaScript verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The Explorer tells a visitor "your browser just verified this, we
      # didn't." That is only honest if a receipt sealed by the Go engine
      # genuinely verifies under an implementation that is not the Go engine.
      # shared/tools/spec/verify-receipts.mjs shares no code with the server: it
      # reimplements canonicalization, leaf composition and the Merkle path
      # from the spec. If the two ever disagree by a byte, this job fails and
      # the claim cannot be made.
      - name: Seal a batch with the Go engine
        run: go run ./server/cmd/seal

      - name: Verify it with an independent implementation
        run: node shared/tools/spec/verify-receipts.mjs

  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # contracts/openapi/openapi.yaml is the source of truth (docs/prd/API.md
      # section 3). Both generated sides are committed, and regenerating must
      # produce no diff, the same discipline the design job holds tokens to.
      - name: Go types match their source
        working-directory: server
        run: go generate ./internal/gateway/api/...

      # sqlc parses migrations/observation and queries/observation directly
      # (docs/prd/API.md section 9.1); it needs no running Postgres to do it,
      # so this stays in this job rather than the go job's Postgres service.
      - name: Go query code matches its source
        working-directory: server
        run: go tool sqlc generate

      - name: TypeScript types match their source
        run: |
          npm ci --no-audit --no-fund
          npm run generate --workspace=clients/packages/api

      - name: No generated file differs from what is committed
        run: |
          if ! git diff --quiet -- server/internal/gateway/api/types.gen.go server/internal/gateway/api/server.gen.go server/internal/store/observationdb server/internal/store/receiptdb clients/packages/api/src/schema.d.ts; then
            echo "Generated contract types differ from the source. Commit the regenerated files."
            git --no-pager diff -- server/internal/gateway/api/types.gen.go server/internal/gateway/api/server.gen.go server/internal/store/observationdb server/internal/store/receiptdb clients/packages/api/src/schema.d.ts
            exit 1
          fi

      # go test ./server/... (the go job) already runs contract_test.go, which
      # loads and validates this same document with kin-openapi, and
      # boundary_test.go, which is the test SERVICE_CATALOG.md section 4 says
      # enforces the service boundaries. Neither is repeated here.

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Fonts
        run: npm run fonts --workspace=clients/web

      - name: ESLint
        working-directory: clients/web
        run: npx eslint .

      - name: Wallet proof
        working-directory: clients/web
        run: node --experimental-strip-types --test tests/wallet-link.node.test.mjs

      # Build before Typecheck, not after: Next writes route-checking types
      # (LayoutProps and friends) to .next/types/ only once a build has run,
      # and tsconfig.json's include only picks them up from there. Committed
      # nowhere, since .next/ is gitignored build output. Running tsc --noEmit
      # first, on a checkout that has never been built, fails with "Cannot
      # find name 'LayoutProps'", exactly the way this job first did: reading
      # green from a working directory that had already been built many
      # times over, then red on a fresh clone of the same commit CI actually
      # runs, which is what forced finding this.
      - name: Build
        working-directory: clients/web
        run: npx next build

      - name: Typecheck
        working-directory: clients/web
        run: npx tsc --noEmit

      # The CSP is proven against a real browser, not assumed. This is what
      # found the inline hydration script the Explorer's stricter policy
      # could not tolerate, which is why the Explorer is its own deployment
      # (docs/decisions/2026-09-27-explorer-stays-separate.md) and this app
      # resolves its own CSP with a per-request nonce instead.
      - name: Install Chromium for the CSP test
        working-directory: clients/web
        run: npx playwright install --with-deps chromium

      - name: CSP test
        working-directory: clients/web
        run: npx playwright test

      - name: Design lint
        run: node .claude/skills/seametry-design/scripts/design-lint.mjs clients/web

  go:
    name: Go
    runs-on: ubuntu-latest
    # docs/prd/API.md section 12 step A1: "a role reading another schema is
    # refused by Postgres, in a test." That test needs a real Postgres to
    # refuse against, not a mock of one.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seametry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEAMETRY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/seametry_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./server/...

      # Race detection is required on every run. It needs cgo, which is why it
      # runs here rather than on a developer's Windows machine.
      #
      # -v, piped through a check for SKIP: SEAMETRY_TEST_DATABASE_URL is set
      # above, so no test gated behind it should ever skip here. A skip in
      # this job is silence, and silence is not success (AGENTS.md).
      - name: Test
        run: |
          set -o pipefail
          go test -race -count=1 -v ./server/... | tee /tmp/go-test.log
          if grep -q '^--- SKIP' /tmp/go-test.log; then
            echo
            echo "A test skipped with SEAMETRY_TEST_DATABASE_URL set. It should have run."
            grep -B1 '^--- SKIP' /tmp/go-test.log
            exit 1
          fi

  design:
    name: Design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Tokens are generated, never hand written. Regenerating must produce no
      # diff, or the committed tokens and their source have drifted and the
      # page is styled by something nobody is reviewing.
      - name: Tokens match their source
        run: |
          node .claude/skills/seametry-design/scripts/build-tokens.mjs \
            .claude/skills/seametry-design/assets/tokens/seametry.tokens.json clients/packages/ui/src/generated
          if ! git diff --quiet -- clients/packages/ui/src/generated; then
            echo "Generated tokens differ from the source. Commit the regenerated files."
            git --no-pager diff -- clients/packages/ui/src/generated
            exit 1
          fi

      # .claude owns the design system (docs/README.md). .agents/skills is
      # where agents that follow the cross-tool convention look for skills, so
      # it carries an exact copy, never an edited one. Unchecked, it fell five
      # files and a week of decisions behind and taught those agents a dark
      # default and round controls that had been retired.
      - name: Agent skill copy matches its source
        run: |
          if ! diff -r .claude/skills/seametry-design .agents/skills/seametry-design; then
            echo "The .agents copy of the design system differs from .claude, which owns it. Refresh it:"
            echo "  rm -rf .agents/skills/seametry-design && cp -r .claude/skills/seametry-design .agents/skills/"
            exit 1
          fi

      # Only ligatures_test.mjs needs node_modules (playwright) or a browser;
      # lint_test.mjs is dependency-free and ran without either until this step
      # was added for the other test alongside it.
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The fonts are gitignored (their licence forbids redistribution through
      # a public repository), so a clean checkout has none, and
      # ligatures_test.mjs measures Fragment Mono itself.
      - name: Fonts
        run: npm run fonts --workspace=clients/web

      # Scoped to the surfaces that exist. apps/web and apps/mobile were the
      # retired TypeScript scaffold; the Explorer replaces the first and
      # prd/MOBILE.md specifies a rebuild of the second in phase 2, neither
      # written yet. Nothing else in the tree produces UI.
      # The linter arrives as an import and is replaced wholesale on each new
      # version of the design system, so a fix inside it does not survive unless
      # something outside it fails when the fix is gone. This is that something.
      # ligatures_test.mjs guards explorer.css's digest-face rule the same way,
      # against Fragment Mono's default programming ligatures (issue 13).
      - name: Linter regressions
        run: npm run design:test

      - name: Design lint
        run: node .claude/skills/seametry-design/scripts/design-lint.mjs server/cmd/explorer clients/packages/ui

  language:
    name: Language boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # docs/ENGINEERING_STANDARD.md section 16. These rules apply to code,
      # comments, copy and documentation, so the check covers all of them and
      # excludes the archive, which is retired historical text, and both copies
      # of the design skill, whose voice tables and linter list the forbidden
      # words in order to forbid them.
      - name: No em dashes
        run: |
          if grep -rInP '\x{2014}' \
              --include='*.go' --include='*.md' --include='*.ts' --include='*.tsx' \
              --include='*.js' --include='*.mjs' --include='*.rs' --include='*.yml' \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=archive --exclude-dir=.claude --exclude-dir=.agents \
              --exclude=AGENTS.md .; then
            echo
            echo "Em dashes are not used in this project. See docs/ENGINEERING_STANDARD.md section 16."
            exit 1
          fi

      # A value is never described as true, correct, fair, safe, guaranteed or
      # pure. Matches only those words applied to a value, so that prose
      # rejecting the usage does not trip the check.
      - name: No value claims
        run: |
          if grep -rInE '\b(true|correct|fair|safe|guaranteed|pure) (price|value|quote|number|rate)\b' \
              --include='*.go' --include='*.md' --include='*.ts' --include='*.tsx' \
              --include='*.js' --include='*.mjs' --include='*.rs' \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=archive --exclude-dir=.claude --exclude-dir=.agents \
              --exclude=AGENTS.md . \
              | grep -vE 'never|not |no |refus|forbid|prohibit'; then
            echo
            echo "A value is never called true, correct, fair, safe, guaranteed or pure."
            echo "See docs/ENGINEERING_STANDARD.md section 16."
            exit 1
          fi

  hall:
    name: Hall program and arithmetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # litesvm 0.10.0 refuses the SBPF v3 that anchor build emits by default,
      # so the program is built with cargo-build-sbf --arch v0.
      - name: Build the program
        working-directory: chain
        run: cargo-build-sbf --arch v0

      - name: Rust reproduces the vectors and the program passes its tests
        working-directory: chain
        run: cargo test --locked

      # A separate workspace, so the two steps above never compile it. It
      # only runs by hand against a cluster; this keeps it from rotting.
      - name: The devnet runner still builds
        working-directory: chain/tools/devnet-demo
        run: |
          cargo fmt --check
          cargo build --release --locked

  explorer:
    name: Explorer builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The site is generated from committed evidence, so it can be rebuilt from
      # any commit. The fonts are fetched, never committed, so this build falls
      # back to system faces; a production build runs npm run fonts
      # --workspace=clients/web first.
      # The same run regenerates the admissions snapshot clients/web imports,
      # so a decision the web app shows is always the one the policy engine
      # makes on the committed evidence, never a stale or hand-edited copy.
      - name: Build
        run: go run ./server/cmd/explorer -admissions shared/evidence/admissions.json

      - name: The admissions snapshot matches the evidence it was made from
        # A block scalar, not a plain one: the ": " inside the message made
        # this line a YAML mapping, and GitHub refused the whole workflow.
        run: |
          git diff --exit-code shared/evidence/admissions.json || { echo "shared/evidence/admissions.json differs from what the policy engine produces; regenerate it with: go run ./server/cmd/explorer -admissions shared/evidence/admissions.json"; exit 1; }

      # The _headers file's CSP staying identical to securityHeaders in host.go
      # is checked by TestHostConfigCSPMatchesSecurityHeaders, which the `go`
      # job runs; asserting it again here in shell would be a second, weaker
      # copy of the same check rather than a reason to add one.
      - name: Every page and the host configuration exist
        run: |
          for file in index.html catalogue.html evidence.html hall.html pillar-light.svg pillar-dark.svg _headers; do
            test -s "dist/explorer/$file" || { echo "missing dist/explorer/$file"; exit 1; }
          done
          ls dist/explorer/hallmark-*.html >/dev/null 2>&1 || { echo "no hallmark pages were generated"; exit 1; }
          ls dist/explorer/lot-*.html >/dev/null 2>&1 || { echo "no lot pages were generated"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: explorer
          path: dist/explorer
          if-no-files-found: error
