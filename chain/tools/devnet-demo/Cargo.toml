# A separate workspace from chain/Cargo.toml, deliberately. cargo-build-sbf
# builds every workspace member for the SBF target, and this crate's HTTP
# client (ureq, and getrandom underneath it) does not compile for that target
# and has no reason to: it only ever runs on a developer's machine against a
# live RPC endpoint. Sharing chain/'s workspace broke `cargo-build-sbf --arch
# v0` the first time it was tried; this is the fix, not a workaround.
[workspace]

[package]
name = "devnet-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Runs the Hall demonstration of HALL.md section 7 against a deployed devnet program, over real transactions"

[[bin]]
name = "devnet-demo"
path = "src/main.rs"

[dependencies]
hall = { path = "../../programs/hall", default-features = false }
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-message = "3.0.1"
solana-transaction = { version = "3.0.2", features = ["bincode"] }
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-hash = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
bincode = "1"
