[package]
name = "hall"
version = "0.1.0"
description = "The Hall: a keyless basket program that strikes and melts baskets without reading a price"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hall"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# Resolves the extra accounts a Token-2022 transfer hook names, so a deposit or
# a delivery can carry them (docs/decisions/2026-10-18-hall-pre-audit-fixes.md).
spl-transfer-hook-interface = "2.1.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
serde_json = "1"
solana-account = "3"
# Writes a transfer hook's extra account list in tests/hooks.rs.
spl-tlv-account-resolution = "0.11.4"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
