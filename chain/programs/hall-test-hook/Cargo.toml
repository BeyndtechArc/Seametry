[package]
name = "hall-test-hook"
version = "0.1.0"
description = "Test only, never deployed: a Token-2022 transfer hook that lets the Hall's tests switch an issuer's hook on"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "hall_test_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
spl-discriminator = "0.5.2"
spl-transfer-hook-interface = "2.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
